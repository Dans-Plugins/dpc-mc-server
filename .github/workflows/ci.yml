name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  docker-build-test:
    name: Docker Build Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [dpcmcserver, vantage-backend, vantage-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create test environment file
      run: cp sample.env .env
    
    - name: Test Docker build for ${{ matrix.service }}
      run: |
        if [ "${{ matrix.service }}" = "dpcmcserver" ]; then
          docker build -t dpc-mc-server .
        elif [ "${{ matrix.service }}" = "vantage-backend" ]; then
          docker build -t vantage-backend ./vantage/backend
        elif [ "${{ matrix.service }}" = "vantage-frontend" ]; then
          docker build -t vantage-frontend ./vantage/frontend
        fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Run backend tests
      working-directory: ./vantage/backend
      run: ./gradlew test --no-daemon
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './vantage/frontend/package-lock.json'
    
    - name: Install frontend dependencies
      working-directory: ./vantage/frontend
      run: npm ci
    
    - name: Run frontend tests
      working-directory: ./vantage/frontend
      run: npm run lint

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Create test environment file
      run: cp sample.env .env
    
    - name: Validate Docker Compose configuration
      run: docker compose config --quiet
    
    - name: Validate all services are defined
      run: |
        services=$(docker compose config --services)
        expected_services="postgres dpcmcserver vantage-backend vantage-frontend"
        
        for service in $expected_services; do
          if ! echo "$services" | grep -q "^$service$"; then
            echo "Error: Service $service not found in compose configuration"
            exit 1
          fi
        done
        
        echo "All expected services found in compose configuration"